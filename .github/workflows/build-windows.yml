name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Configure native plugin
        run: cmake --preset windows-x64 -G "Visual Studio 17 2022" -A x64 -DENABLE_QT=OFF -DENABLE_FRONTEND_API=OFF

      - name: Build native plugin
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Package Windows installer
        run: python scripts/build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: KattBeautyStudio-windows-x64
          path: KattBeautyStudio-0.20.0-windows-x64.zip
          if-no-files-found: error
